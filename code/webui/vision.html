<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/svg+xml" href="/favicon.svg">
    <title>mind box · 视觉识别</title>
  </head>
  <body>
    <header class="toolbar"><a class="brand" href="/">mind box</a><span>视觉识别</span><nav><a class="tool" href="/" aria-label="返回柜体" title="返回柜体"><i data-lucide="arrow-left"></i></a><button class="tool" id="refresh" aria-label="刷新" title="刷新"><i data-lucide="refresh-cw"></i></button><button class="command" id="print" disabled><i data-lucide="printer"></i>打印标记</button></nav></header>
    <main class="layout">
      <section class="camera-section"><div class="section-heading"><h1>抽屉视觉识别</h1><span class="badge" id="status" role="status">正在连接</span></div><div class="camera"><span id="empty">等待摄像头画面</span><img id="preview" alt="实时摄像头画面" hidden><canvas id="overlay" aria-hidden="true"></canvas></div><div class="camera-footer"><span id="resolution">—</span><span id="door-status">状态待确认</span></div></section>
      <aside class="controls"><h2>识别状态</h2><table><thead><tr><th>抽屉</th><th>识别码</th><th>开合</th></tr></thead><tbody id="markers"></tbody></table><div class="observation"><h2>确认状态</h2><dl><dt>开门确认</dt><dd id="open-delay">—</dd><dt>关门延时</dt><dd id="close-delay">—</dd></dl><p class="message" id="message" role="status"></p></div></aside>
    </main>
    <section class="print-sheet" aria-label="打印标记"><h1>mind box · 抽屉标记</h1><div class="print-grid"><figure><img data-marker="1" alt="第一层标记 1"><figcaption>1 · 第一层（上）</figcaption></figure><figure><img data-marker="2" alt="第二层标记 2"><figcaption>2 · 第二层（中）</figcaption></figure><figure><img data-marker="3" alt="第三层标记 3"><figcaption>3 · 第三层（下）</figcaption></figure></div><p>DICT_4X4_50 · 原始比例 100% · 黑色方块边长 50 mm</p></section>
    <script type="module" src="/vision.js"></script>
  </body>
</html>
